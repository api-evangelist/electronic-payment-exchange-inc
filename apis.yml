aid: electronic-payment-exchange-inc
name: Electronic payment Exchange Inc
description: >-
  Electronic Payment Exchange (EPX) is a full-stack, PCI-compliant payments
  platform that has processed card, ACH, and alternative payments for merchants
  and banks across the United States, Canada, Europe, Latin America, and the
  Caribbean for more than forty years. Now part of North (North American
  Bancard), EPX combines the roles of ISO, merchant acquirer, gateway, and
  front-end and back-end processor under one contract. Its BRIC technology
  issues a unique token for every transaction so cardholder data never touches
  the merchant environment. Developers integrate through EPX Hosted Checkout,
  the Hosted Pay Page, the Browser Post API, and the North EPX Custom Pay REST
  API, all documented on the North Developer portal, supporting sales,
  authorizations, captures, refunds, voids, recurring billing, and batch
  settlement with EMV, tokenization, and encryption throughout.
